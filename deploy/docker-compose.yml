# Despliegue de la prueba de concepto en el VPS.
#
# Levanta tres servicios:
#   db       PostgreSQL, con los datos en un volumen para que sobrevivan a reinicios
#   backend  la API de Node
#   caddy    servidor web que publica el backend y gestiona el certificado HTTPS
#
# Caddy solicita y renueva el certificado de Let's Encrypt automáticamente.
# No hay que ejecutar certbot ni programar renovaciones.
#
# Uso:
#   docker compose up -d      levantar
#   docker compose logs -f    ver registros
#   docker compose down       detener

services:
  db:
    image: postgres:16-alpine
    container_name: alarma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # El backend espera a que la base responda antes de arrancar. Sin esto
    # el backend falla en el primer intento porque PostgreSQL tarda unos
    # segundos en aceptar conexiones.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - alarma

  backend:
    build: ../backend
    container_name: alarma_backend
    restart: unless-stopped
    # Se publica en el puerto BACKEND_PORT del servidor (8080 por defecto).
    # Si ese puerto estuviera ocupado, define BACKEND_PORT en el archivo .env,
    # por ejemplo BACKEND_PORT=8090, y ajusta la URL en el firmware.
    ports:
      - "${BACKEND_PORT:-8080}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # La base viaja por la red interna de Docker, que no sale del servidor,
      # por lo que no se habilita TLS en esa conexión.
      PGSSL: "off"
      DEVICE_TOKEN: ${DEVICE_TOKEN}
      PORT: "3000"
      # Notificaciones push por ntfy. Sin NTFY_TOPIC no se envian avisos.
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      # Habilita el boton de borrar historial. Solo para la etapa de pruebas.
      MODO_PRUEBAS: ${MODO_PRUEBAS:-false}
      # Cuentas: con false solo se puede crear la primera cuenta y despues se
      # entra por codigo de invitacion. Con true cualquiera puede registrarse.
      REGISTRO_ABIERTO: ${REGISTRO_ABIERTO:-false}
      # Camara. Las fotos son archivos en disco; el VPS es de 40 GB, asi que hay
      # topes de dias y de espacio. No se guarda video, solo fotos.
      FOTOS_DIR: /app/datos/fotos
      FOTOS_DIAS: ${FOTOS_DIAS:-14}
      FOTOS_MB_VIVIENDA: ${FOTOS_MB_VIVIENDA:-300}
      FOTOS_MB_TOTAL: ${FOTOS_MB_TOTAL:-1500}
      FOTOS_MIN_LIBRE_MB: ${FOTOS_MIN_LIBRE_MB:-1500}
      VIVO_SESION_MAX_S: ${VIVO_SESION_MAX_S:-300}
      VIVO_DIA_MAX_MIN: ${VIVO_DIA_MAX_MIN:-60}
      CAMARA_RAFAGA: ${CAMARA_RAFAGA:-3}
      # Camara Mercusys MC210 por el tunel WireGuard (ver firmware/puente_camara_s3).
      # Todo esto queda DESACTIVADO mientras ONVIF_ACTIVO y CAMARA_RTSP_ACTIVO no valgan 1.
      # Eventos de personas y movimiento por ONVIF: registran y avisan; solo suenan la alarma si se define ONVIF_SIRENA.
      ONVIF_ACTIVO: ${ONVIF_ACTIVO:-0}
      ONVIF_VIVIENDA_ID: ${ONVIF_VIVIENDA_ID:-}
      ONVIF_CAMARA_ID: ${ONVIF_CAMARA_ID:-mc210}
      ONVIF_HOST: ${ONVIF_HOST:-10.8.0.2}
      ONVIF_PUERTO: ${ONVIF_PUERTO:-2020}
      ONVIF_USUARIO: ${ONVIF_USUARIO:-}
      ONVIF_CLAVE: ${ONVIF_CLAVE:-}
      ONVIF_ALERTAR: ${ONVIF_ALERTAR:-persona}
      ONVIF_SOLO_ARMADO: ${ONVIF_SOLO_ARMADO:-1}
      # Alarma por la camara: vacio = nunca suena (solo registra y avisa). Con "movimiento", un movimiento
      # (o una persona) con la casa armada marca la alarma y enciende la salida audible ONVIF_SIRENA_S segundos.
      ONVIF_SIRENA: ${ONVIF_SIRENA:-}
      ONVIF_SIRENA_S: ${ONVIF_SIRENA_S:-30}
      # Segundos despues de armar en los que la camara no avisa ni suena (para poder salir de casa)
      ONVIF_RETARDO_SALIDA_S: ${ONVIF_RETARDO_SALIDA_S:-60}
      ONVIF_COOLDOWN_PERSONA_S: ${ONVIF_COOLDOWN_PERSONA_S:-60}
      ONVIF_COOLDOWN_MOVIMIENTO_S: ${ONVIF_COOLDOWN_MOVIMIENTO_S:-120}
      ONVIF_LOG_XML: ${ONVIF_LOG_XML:-}
      # Fotos y vista en vivo de la MC210 por RTSP, solo bajo demanda (ffmpeg corre unos segundos por tarea).
      # CAMARA_TOKEN normalmente va vacio: el agente usa un token interno del propio servidor, que sirve
      # aunque la vivienda tenga token propio. Solo se define si el agente corriera fuera del servidor.
      CAMARA_RTSP_ACTIVO: ${CAMARA_RTSP_ACTIVO:-0}
      CAMARA_TOKEN: ${CAMARA_TOKEN:-}
      RTSP_RUTA_FOTO: ${RTSP_RUTA_FOTO:-stream1}
      RTSP_RUTA_VIVO: ${RTSP_RUTA_VIVO:-stream2}
    volumes:
      - datos_fotos:/app/datos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alarma

# Nota sobre HTTPS.
#
# El servidor ya tiene otro proyecto ocupando los puertos 80 y 443, por lo que no
# se incluye Caddy en este despliegue. Let's Encrypt valida el dominio a través
# del puerto 80, así que no es posible emitir un certificado mientras ese puerto
# esté en uso por otro servicio.
#
# La prueba de concepto opera entonces sobre HTTP, protegida por el token del
# dispositivo. La actividad no exige cifrado en esta etapa y la estrategia de
# seguridad se define en talleres posteriores. El archivo Caddyfile se conserva
# en esta carpeta para cuando el puerto 80 quede disponible o se integre este
# servicio al servidor web existente.

volumes:
  datos_postgres:
  datos_fotos:

networks:
  alarma:
    driver: bridge
