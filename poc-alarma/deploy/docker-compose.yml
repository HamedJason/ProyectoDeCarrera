# Despliegue de la prueba de concepto en el VPS.
#
# Levanta tres servicios:
#   db       PostgreSQL, con los datos en un volumen para que sobrevivan a reinicios
#   backend  la API de Node
#   caddy    servidor web que publica el backend y gestiona el certificado HTTPS
#
# Caddy solicita y renueva el certificado de Let's Encrypt automáticamente.
# No hay que ejecutar certbot ni programar renovaciones.
#
# Uso:
#   docker compose up -d      levantar
#   docker compose logs -f    ver registros
#   docker compose down       detener

services:
  db:
    image: postgres:16-alpine
    container_name: alarma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # El backend espera a que la base responda antes de arrancar. Sin esto
    # el backend falla en el primer intento porque PostgreSQL tarda unos
    # segundos en aceptar conexiones.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - alarma

  backend:
    build: ../backend
    container_name: alarma_backend
    restart: unless-stopped
    # Se publica directamente en el puerto 8080 del servidor.
    # Si ese puerto también estuviera ocupado, basta cambiar el número de la
    # izquierda, por ejemplo "8090:3000", y ajustar la URL en el firmware.
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # La base viaja por la red interna de Docker, que no sale del servidor,
      # por lo que no se habilita TLS en esa conexión.
      PGSSL: "off"
      DEVICE_TOKEN: ${DEVICE_TOKEN}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alarma

# Nota sobre HTTPS.
#
# El servidor ya tiene otro proyecto ocupando los puertos 80 y 443, por lo que no
# se incluye Caddy en este despliegue. Let's Encrypt valida el dominio a través
# del puerto 80, así que no es posible emitir un certificado mientras ese puerto
# esté en uso por otro servicio.
#
# La prueba de concepto opera entonces sobre HTTP, protegida por el token del
# dispositivo. La actividad no exige cifrado en esta etapa y la estrategia de
# seguridad se define en talleres posteriores. El archivo Caddyfile se conserva
# en esta carpeta para cuando el puerto 80 quede disponible o se integre este
# servicio al servidor web existente.

volumes:
  datos_postgres:

networks:
  alarma:
    driver: bridge
